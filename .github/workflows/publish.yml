name: Publish to Chrome Web Store & Firefox AMO
# CWS は「アップロード」と「審査への申請」を別 workflow に分けている。
# この workflow は検証済みZIPを下書きとしてアップロードするだけで、申請しない。
# 申請は掲載画像などを Dashboard で整えた後に、cws-submit.yml を手動で実行する。

# ブランチ命名規約:
#   release/X.Y.Z (例: release/3.0.0)
#
# `release/<X.Y.Z>` の新規作成時の初回 push で variant matrix を並列実行 (default + notosans)。
# 全 variant が同じ version を共有し、 matrix strategy で並列公開する。
# variants/<name>.json の version とブランチ末尾の X.Y.Z が一致する必要がある。
#
# 公開先:
#   - Chrome Web Store (scripts/Publish-Cws.ps1。アップロードのみ。申請は cws-submit.yml)
#   - Firefox AMO (scripts/Publish-Amo.ps1。既存 GUID への新 version 提出。審査完了は待たない)

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 再開する variant
        type: choice
        required: true
        options: [default, notosans]
      target:
        description: 再開するストア
        type: choice
        required: true
        options: [chrome, firefox]
      expected_sha:
        description: 照合済みの release source SHA（修復後は FIX_SHA）
        type: string
        required: true

permissions:
  contents: read

# 同一リポジトリの全 release branch と手動実行を直列化する。
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  # 公開前ゲート: 本体の検証（verify.yml）が通らなければ publish job は走らない。
  # 条件は publish と同じ（release ブランチの初回 push / 手動再開のみ）。
  verify:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == true)) }}
    name: Verify before publish
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    needs: verify
    # 修復 push や GitHub rerun は自動提出しない。再開は対象を指定する。
    if: ${{ startsWith(github.ref, 'refs/heads/release/') && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == true)) }}
    name: Publish ${{ matrix.variant }}
    runs-on: ubuntu-latest
    # matrix で全 variant を並列実行。1 variant が失敗しても他は続行。
    strategy:
      fail-fast: false
      matrix:
        variant: [default, notosans]
    steps:
      - name: 対象を選択
        id: select
        env:
          EVENT: ${{ github.event_name }}
          VARIANT: ${{ matrix.variant }}
          SELECTED_VARIANT: ${{ inputs.variant }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "chrome=true" >> "$GITHUB_OUTPUT"
            echo "firefox=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            case "$SELECTED_VARIANT" in
              default|notosans) ;;
              *) echo "::error::未対応の variant: $SELECTED_VARIANT"; exit 1 ;;
            esac
            case "$TARGET" in
              chrome|firefox) ;;
              *) echo "::error::未対応のストア: $TARGET"; exit 1 ;;
            esac
            if [ "$SELECTED_VARIANT" = "$VARIANT" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "$TARGET=true" >> "$GITHUB_OUTPUT"
            else
              echo "variant=$VARIANT は今回の対象外です"
            fi
          else
            echo "::error::未対応のイベント: $EVENT"
            exit 1
          fi
      - name: Checkout release commit with native git
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: 再開対象の source SHA を照合
        id: head_check
        if: ${{ success() && steps.select.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_sha }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha には照合済みの完全な source SHA を指定してください"
            exit 1
          fi
          checkout_sha=$(git rev-parse HEAD)
          if [ "$checkout_sha" != "$EXPECTED_HEAD_SHA" ] || [ "$EVENT_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::指定 source SHA と checkout または実行対象の SHA が一致しません"
            exit 1
          fi
          echo "再開対象 source SHA: $checkout_sha"

      - name: ブランチ名から version を抽出
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        id: parse
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # 期待形式: release/<X.Y.Z>
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::ブランチ名がフォーマット release/<X.Y.Z> に一致しません: $BRANCH"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "🎯 version=$version (variant=${{ matrix.variant }})"

      - name: Prepare Bun build toolchain
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: バリアントの version とブランチ version の整合性チェック
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        env:
          VARIANT: ${{ matrix.variant }}
          BRANCH_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if [ ! -f "variants/${VARIANT}.json" ]; then
            echo "::error::variants/${VARIANT}.json が見つかりません"
            exit 1
          fi
          variant_version=$(bun -p "require('./variants/${VARIANT}.json').version")
          if [ "$variant_version" != "$BRANCH_VERSION" ]; then
            echo "::error::variants/${VARIANT}.json の version ($variant_version) とブランチ ($BRANCH_VERSION) が一致しません"
            exit 1
          fi
          echo "✅ variants/${VARIANT}.json の version とブランチ一致: $variant_version"

      - name: 依存インストール
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        run: bun run deps
      - name: Validate dependency security patches
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        run: bun run test:dependencies
      # 共通部品の同期・アイコン・CSS・variant manifest は package.json の build:<variant> に一本化する。
      # フォント変換（convert-fonts）は WOFF2 をコミット済みで扱うため配布経路では行わない。
      - name: variant をビルド（共通部品の同期・アイコン・CSS・manifest）
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: bun --bun run "build:$VARIANT"

      - name: 共通サポート部品の同期を確認
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        run: bun --bun run check:support

      - name: 生成された manifest の version を確認
        if: ${{ success() && steps.select.outputs.enabled == 'true' }}
        id: common_ready
        env:
          BRANCH_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          manifest_version=$(bun -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$BRANCH_VERSION" ]; then
            echo "::error::manifest.json の version ($manifest_version) とブランチ ($BRANCH_VERSION) が一致しません"
            exit 1
          fi
          echo "✅ manifest.json の version: $manifest_version"

      - name: zip パッケージを作成
        if: ${{ success() && steps.select.outputs.enabled == 'true' && steps.select.outputs.chrome == 'true' }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          zip_base=$(bun -p "require('./variants/${VARIANT}.json').zipBaseName")
          zip_path="${zip_base}-chrome.zip"
          # 配布内容を ZIP と照合するため専用ディレクトリに固定する。
          chrome_dir="chrome-build"
          bun scripts/package-source.js "$VARIANT" --stage chrome "$chrome_dir"
          (cd "$chrome_dir" && zip -r "$GITHUB_WORKSPACE/$zip_path" manifest.json _locales "icons/${VARIANT}" src)
          echo "CHROME_SOURCE_DIR=$chrome_dir" >> "$GITHUB_ENV"
          ls -lh "$zip_path"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"

      - name: variant に対応する EXTENSION_ID を決定
        if: ${{ success() && steps.select.outputs.enabled == 'true' && steps.select.outputs.chrome == 'true' }}
        id: ext
        env:
          VARIANT: ${{ matrix.variant }}
          ID_DEFAULT: ${{ secrets.CWS_EXTENSION_ID_DEFAULT }}
          ID_NOTOSANS: ${{ secrets.CWS_EXTENSION_ID_NOTOSANS }}
        run: |
          case "$VARIANT" in
            default)
              extension_id="$ID_DEFAULT"
              ;;
            notosans)
              extension_id="$ID_NOTOSANS"
              ;;
            *)
              echo "::error::未対応の variant: $VARIANT (publish.yml の matrix と case を更新してください)"
              exit 1
              ;;
          esac
          if [ -z "$extension_id" ]; then
            echo "::error::variant=$VARIANT に対応する CWS_EXTENSION_ID_* secret が空です"
            exit 1
          fi
          echo "extension_id=$extension_id" >> "$GITHUB_OUTPUT"

      - name: Chrome Web Store にアップロード（下書き）
        if: ${{ success() && steps.select.outputs.enabled == 'true' && steps.select.outputs.chrome == 'true' }}
        # 認証情報は環境変数のみ (CLIENT_ID / CLIENT_SECRET / REFRESH_TOKEN / PUBLISHER_ID / EXTENSION_ID)。
        # -Stage Upload は下書きとしてアップロードするだけで申請しない。
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ steps.ext.outputs.extension_id }}
          VARIANT: ${{ matrix.variant }}
          BRANCH_VERSION: ${{ steps.parse.outputs.version }}
        # integrity 検証済みの固定 CLI に、検証した同じ ZIP path を渡す。
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          VERIFY_RECEIPT_PATH="$RUNNER_TEMP/chrome-verified.json" bun scripts/verify-release-archive.js verify "$VARIANT" "$BRANCH_VERSION" "$CHROME_SOURCE_DIR" "$ZIP_PATH" chrome
          CHROME_SHA256=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/chrome-verified.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "$ZIP_PATH" -ExpectedSha256 "$CHROME_SHA256" -Stage Upload
          echo "🎉 ${{ matrix.variant }} → Chrome Web Store へのアップロード完了 (申請は cws-submit.yml)"

      - name: Firefox 用ソースディレクトリを準備
        id: firefox_source
        # 前段の失敗後は停止し、Firefox 単独の手動再開で進める。
        if: ${{ success() && steps.select.outputs.enabled == 'true' && steps.select.outputs.firefox == 'true' && steps.common_ready.outcome == 'success' }}
        env:
          VARIANT: ${{ matrix.variant }}
        # クリーンなディレクトリを構築する。manifest.json + _locales + icons/<variant> + src のみ。
        # Firefox AMO の MV3 validator は service_worker 単独を reject するため、
        # --firefox フラグで manifest.json を再生成して background.scripts を併記。
        # Chrome step はこれより前に実行済みなので、 Chrome 用 manifest が上書きされても問題ない。
        run: |
          firefox_dir="firefox-build"
          bun scripts/build-variant.js "${VARIANT}" --firefox
          # ストア配信に不要なファイルの除外 (Chrome ZIP と同じポリシー + TTF 除外) は --stage が行う。
          # v3.0.3 戦略: replacefont-extension.css は WAR から fetch するので配布に含める。
          bun scripts/package-source.js "$VARIANT" --stage firefox "$firefox_dir"
          echo "FIREFOX_SOURCE_DIR=$firefox_dir" >> "$GITHUB_ENV"
          echo "📦 Firefox source dir contents:"
          ls -la "$firefox_dir"

      - name: Firefox AMO に submission API でアップロード
        if: ${{ success() && steps.firefox_source.outcome == 'success' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VARIANT: ${{ matrix.variant }}
          BRANCH_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e "$FIREFOX_SOURCE_DIR/.amo-upload-uuid"
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory "$FIREFOX_SOURCE_DIR" -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERIFY_RECEIPT_PATH=web-ext-artifacts/verified.json bun scripts/verify-release-archive.js verify "$VARIANT" "$BRANCH_VERSION" "$FIREFOX_SOURCE_DIR" "$ARCHIVE" firefox
          ADDON_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["browser_specific_settings"]["gecko"]["id"])' "$FIREFOX_SOURCE_DIR/manifest.json")
          SHA256=$(python3 -c 'import json; print(json.load(open("web-ext-artifacts/verified.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata ".amo-metadata-$VARIANT.json" -AddonId "$ADDON_ID" -ExpectedVersion "$BRANCH_VERSION" -ExpectedSha256 "$SHA256"
