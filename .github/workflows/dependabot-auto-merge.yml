name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Dependency validation"]
    types: [completed]
  check_run:
    types: [completed]
  status:
  workflow_dispatch:
  push:

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    if: >-
      github.repository_owner == '1llum1n4t1s' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.id == 49699333) &&
      (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'status' || github.event.state == 'success') &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug != 'github-actions')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify CI and merge Dependabot updates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUIRED_WORKFLOWS: '[".github/workflows/dependency-validation.yml"]'
        with:
          script: |
            // GitHub Actions の信頼済み既定ブランチ上で実行する。PR のコードは実行しない。
            const {owner, repo} = context.repo;
            const required = JSON.parse(process.env.REQUIRED_WORKFLOWS);
            const repository = (await github.rest.repos.get({owner, repo})).data;
            const branch = repository.default_branch;
            const botId = 49699333;
            const report = [];
            const held = (pr, reason) => {
              core.info(`#${pr.number}: ${reason}`);
              report.push(`- #${pr.number}: ${reason}`);
            };
            
            function versionOnlyPatch(file) {
              if (!file.patch || file.status !== 'modified') return false;
              const lines = file.patch.split('\n').filter(line => /^[+-]/.test(line) && !/^\+\+\+|^---/.test(line));
              const before = lines.filter(line => line[0] === '-').map(line => line.slice(1));
              const after = lines.filter(line => line[0] === '+').map(line => line.slice(1));
              if (!before.length || before.length !== after.length) return false;
              const normalize = line => line.replace(/(uses:\s*[^\s@]+@)[A-Za-z0-9._/-]+/g, '$1<VERSION>');
              return before.every((line, i) => /^\s*(?:-\s*)?uses:\s*[^\s@]+@[A-Za-z0-9._/-]+(?:\s*#.*)?$/.test(line)
                && /^\s*(?:-\s*)?uses:\s*[^\s@]+@[A-Za-z0-9._/-]+(?:\s*#.*)?$/.test(after[i])
                && normalize(line).replace(/\s+#.*$/, '') === normalize(after[i]).replace(/\s+#.*$/, ''));
            }
            
            async function dependencyFile(file, baseSha, sha) {
              const name = file.filename;
              if (/^\.github\/workflows\/[^/]+\.ya?ml$/.test(name)) {
                return versionOnlyPatch(file);
              }
              if (/(^|\/)Dockerfile(?:\.[^/]+)?$/.test(name) || /(^|\/)(?:docker-)?compose(?:\.[^/]+)?\.ya?ml$/.test(name)) {
                if (!file.patch || file.status !== 'modified') return false;
                const changed = file.patch.split('\n').filter(line => /^[+-]/.test(line) && !/^\+\+\+|^---/.test(line));
                return changed.length > 0 && changed.every(line => /^[+-]\s*(?:FROM\s|image:\s)/i.test(line));
              }
              const manifest = /(^|\/)(?:Package\.swift|Package\.resolved|vcpkg\.json|vcpkg-configuration\.json|rust-toolchain(?:\.toml)?|Directory\.Build\.props|package\.json|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|yarn\.lock|bun\.lockb?|Cargo\.toml|Cargo\.lock|Gemfile|Gemfile\.lock|pubspec\.yaml|pubspec\.lock|global\.json|packages\.config|packages\.lock\.json|Directory\.Packages\.props|requirements[^/]*\.txt|setup\.py|setup\.cfg|pyproject\.toml|poetry\.lock|uv\.lock|Pipfile(?:\.lock)?|build\.gradle(?:\.kts)?|settings\.gradle(?:\.kts)?|gradle\.properties|libs\.versions\.toml|gradle-wrapper\.properties|gradle\.lockfile|[^/]+\.lockfile|\.terraform\.lock\.hcl)$/.test(name)
                || /\.(?:csproj|fsproj|vbproj|tf)$/.test(name);
              if (manifest) return true;
              // 既存submoduleのcommit差分だけを許可し、URL変更や通常コードは許可しない。
              if (file.status !== 'modified' || !file.patch) return false;
              const lines = file.patch.split('\n').filter(line => /^[+-]/.test(line) && !/^\+\+\+|^---/.test(line));
              if (lines.length !== 2) return false;
              const before = lines.find(line => line.startsWith('-'))?.match(/^-Subproject commit ([0-9a-f]{40})$/);
              const after = lines.find(line => line.startsWith('+'))?.match(/^\+Subproject commit ([0-9a-f]{40})$/);
              if (!before || !after) return false;
              try {
                const oldModule = (await github.rest.repos.getContent({owner, repo, path: name, ref: baseSha})).data;
                const newModule = (await github.rest.repos.getContent({owner, repo, path: name, ref: sha})).data;
                return Boolean(oldModule.submodule_git_url && oldModule.submodule_git_url === newModule.submodule_git_url
                  && oldModule.sha === before[1] && newModule.sha === after[1] && file.sha === newModule.sha);
              } catch (error) {
                if (error.status !== 404) throw error;
                return false;
              }
            }
            
            let prs;
            if (context.eventName === 'pull_request_target') {
              prs = [context.payload.pull_request];
            } else {
              prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', base: branch, per_page: 100});
            }
            prs = prs.filter(pr => pr.user?.login === 'dependabot[bot]' && pr.user.id === botId && !pr.draft
              && pr.base.ref === branch && pr.head.repo?.id === repository.id);
            if (!required.length) {
              core.warning('検証 workflow が未設定のためマージを保留します。');
              return;
            }
            const workflows = [];
            for (const path of required) {
              workflows.push((await github.rest.actions.getWorkflow({owner, repo, workflow_id: path.split('/').pop()})).data);
            }
            
            const dispatchedConditions = new Set();
            for (let pass = 0; pass <= prs.length; pass++) {
              let mergedThisPass = false;
            for (const item of prs) {
              let pr = (await github.rest.pulls.get({owner, repo, pull_number: item.number})).data;
              if (pr.state !== 'open' || pr.draft || pr.user?.id !== botId || pr.head.repo?.id !== repository.id || pr.base.ref !== branch) continue;
              const sha = pr.head.sha;
              // PRのbase.shaは作成時点の値を返すことがあるため、既定ブランチを直接取得する。
              const baseSha = (await github.rest.repos.getBranch({owner, repo, branch})).data.commit.sha;
              const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
              let dependencyOnly = true;
              for (const file of files) {
                if (!(await dependencyFile(file, baseSha, sha))) { dependencyOnly = false; break; }
              }
              if (!files.length || files.length !== pr.changed_files || !dependencyOnly) {
                held(pr, '依存更新以外、または自動確認できない差分があるため保留');
                continue;
              }
              const commits = await github.paginate(github.rest.pulls.listCommits, {owner, repo, pull_number: pr.number, per_page: 100});
              if (!commits.length || commits.length !== pr.commits || commits.some(commit => !commit.commit.verification?.verified
                || (commit.author?.id !== botId && !(commit.parents.length === 2 && ['github-actions[bot]', owner].includes(commit.author?.login))))) {
                held(pr, 'Dependabotの署名付き更新または既定ブランチの統合として確認できないコミットがあるため保留');
                continue;
              }
              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                held(pr, '競合があるため保留');
                continue;
              }
              let verified = true;
              const verifiedRuns = [];
              for (const workflow of workflows) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id: workflow.id, head_sha: sha, event: 'pull_request', per_page: 100});
                const latest = runs.sort((a, b) => b.id - a.id)[0];
                if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                  held(pr, `${workflow.name}: ${latest ? latest.conclusion ?? latest.status : '当該headのCI未実行'} のため待機`);
                  verified = false;
                  break;
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {owner, repo, run_id: latest.id, attempt_number: latest.run_attempt, per_page: 100});
                const provenance = `検証基点 pr=${pr.number} base=${baseSha} head=${sha}`;
                const matching = jobs.filter(job => job.name === 'validate' && job.status === 'completed' && job.conclusion === 'success')
                  .flatMap(job => job.steps || []).filter(step => step.name === provenance && step.status === 'completed' && step.conclusion === 'success');
                if (matching.length !== 1) {
                  const title = `dependency-validation pr=${pr.number} base=${baseSha} head=${sha}`;
                  const dispatched = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id: workflow.id, event: 'workflow_dispatch', per_page: 100});
                  const existing = dispatched.filter(run => run.display_title === title && run.head_sha === baseSha && run.head_branch === branch).sort((a, b) => b.id - a.id)[0];
                  if (!existing) {
                    const condition = `${workflow.id}:${pr.number}:${baseSha}:${sha}`;
                    if (!dispatchedConditions.has(condition)) {
                      await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id: workflow.id, ref: branch, inputs: {pr: String(pr.number), base: baseSha, head: sha}});
                      dispatchedConditions.add(condition);
                      held(pr, `${workflow.name}: 現在の結合結果の再検証を要求`);
                    } else {
                      held(pr, `${workflow.name}: 要求済みの再検証を待機`);
                    }
                    verified = false;
                    break;
                  }
                  if (existing.status !== 'completed' || existing.conclusion !== 'success') {
                    held(pr, `${workflow.name}: 再検証 ${existing.conclusion ?? existing.status} のため保留`);
                    verified = false;
                    break;
                  }
                  const retryJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {owner, repo, run_id: existing.id, attempt_number: existing.run_attempt, per_page: 100});
                  const retryMatching = retryJobs.filter(job => job.name === 'validate' && job.status === 'completed' && job.conclusion === 'success').flatMap(job => job.steps || []).filter(step => step.name === provenance && step.status === 'completed' && step.conclusion === 'success');
                  if (retryMatching.length !== 1) {
                    held(pr, `${workflow.name}: 再検証の基点を確認できないため保留`);
                    verified = false;
                    break;
                  }
                  verifiedRuns.push({workflow, id: existing.id, attempt: existing.run_attempt, event: 'workflow_dispatch', title});
                } else {
                  verifiedRuns.push({workflow, id: latest.id, attempt: latest.run_attempt, event: 'pull_request'});
                }
              }
              if (!verified) continue;
              const checks = await github.paginate(github.rest.checks.listForRef, {owner, repo, ref: sha, filter: 'latest', per_page: 100});
              // 同じ自動マージ処理の実行中checkだけを除き、他のcheckの失敗・未完了は保留する。
              const selfRun = `/actions/runs/${context.runId}`;
              const others = checks.filter(check => !check.details_url?.includes(selfRun));
              if (others.some(check => check.status !== 'completed' || !['success', 'neutral', 'skipped'].includes(check.conclusion))) {
                held(pr, '他のcheckが未完了または失敗しているため保留');
                continue;
              }
              const statuses = (await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha, per_page: 100})).data;
              if (statuses.total_count > 0 && statuses.state !== 'success') {
                held(pr, `commit statusが${statuses.state}のため保留`);
                continue;
              }
              for (const verifiedRun of verifiedRuns) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id: verifiedRun.workflow.id, event: verifiedRun.event, per_page: 100});
                const latest = runs.filter(run => verifiedRun.event === 'pull_request' ? run.head_sha === sha : run.display_title === verifiedRun.title && run.head_sha === baseSha && run.head_branch === branch).sort((a, b) => b.id - a.id)[0];
                if (!latest || latest.id !== verifiedRun.id || latest.run_attempt !== verifiedRun.attempt || latest.status !== 'completed' || latest.conclusion !== 'success') {
                  held(pr, `${verifiedRun.workflow.name}: 検証 run が更新されたため待機`);
                  verified = false;
                  break;
                }
              }
              if (!verified) continue;
              const currentBase = (await github.rest.repos.getBranch({owner, repo, branch})).data.commit.sha;
              pr = (await github.rest.pulls.get({owner, repo, pull_number: pr.number})).data;
              if (pr.state !== 'open' || pr.head.sha !== sha || currentBase !== baseSha || pr.mergeable !== true) {
                held(pr, 'head/baseまたはマージ可能状態が変化したため再検証を待機');
                continue;
              }
              const mergeMethod = repository.allow_squash_merge ? 'squash' : repository.allow_merge_commit ? 'merge' : 'rebase';
              try {
                const result = (await github.rest.pulls.merge({owner, repo, pull_number: pr.number, sha, merge_method: mergeMethod})).data;
                if (result.merged) mergedThisPass = true;
                held(pr, result.merged ? `CI成功後にマージ済み (${result.sha})` : 'GitHubのマージ要件を満たすまで保留');
              } catch (error) {
                if (![403, 405, 409, 422].includes(error.status)) throw error;
                held(pr, `GitHubのマージ要件により保留 (${error.status})`);
              }
            }
              if (!mergedThisPass) break;
            }
            await core.summary.addHeading('Dependabot auto-merge').addRaw(report.join('\n') || '対象PRなし').write();
