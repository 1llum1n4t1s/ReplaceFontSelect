name: Dependency validation
run-name: 'dependency-validation pr=${{ inputs.pr || github.event.pull_request.number }} base=${{ inputs.base || github.event.pull_request.base.sha }} head=${{ inputs.head || github.event.pull_request.head.sha }}'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Dependabot PR number
        required: true
        type: string
      base:
        description: Expected base SHA
        required: true
        type: string
      head:
        description: Expected head SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 再検証対象を確認
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        with:
          script: |
            const { PR_NUMBER, BASE_SHA, HEAD_SHA } = process.env;
            if (!/^[1-9][0-9]*$/.test(PR_NUMBER) || !/^[0-9a-f]{40}$/.test(BASE_SHA) || !/^[0-9a-f]{40}$/.test(HEAD_SHA) || context.sha !== BASE_SHA) throw Error('再検証入力が不正');
            const { owner, repo } = context.repo;
            const repository = (await github.rest.repos.get({owner, repo})).data;
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: Number(PR_NUMBER)})).data;
            const base = (await github.rest.repos.getBranch({owner, repo, branch: repository.default_branch})).data.commit.sha;
            if (pr.state !== 'open' || pr.user.id !== 49699333 || pr.head.repo?.id !== repository.id || pr.base.ref !== repository.default_branch || pr.head.sha !== HEAD_SHA || base !== BASE_SHA) throw Error('PR または base が変化');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/pull/{0}/merge', inputs.pr) }}
          fetch-depth: 2
      - name: '検証基点 pr=${{ inputs.pr || github.event.pull_request.number }} base=${{ inputs.base || github.event.pull_request.base.sha }} head=${{ inputs.head || github.event.pull_request.head.sha }}'
        env:
          BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          if [ -n "$MERGE_SHA" ]; then test "$(git rev-parse HEAD)" = "$MERGE_SHA"; fi
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate web-ext release contract
        run: node scripts/verify-release-archive.js check-web-ext
      - name: Validate Dependabot auto-merge decisions
        run: node --test scripts/verify-dependabot-auto-merge.cjs
      - name: Validate 1
        run: pnpm run check:support
      - name: Validate 2
        run: pnpm run build:default
      - name: Validate 3
        run: pnpm run build:notosans
      - name: Validate 4
        run: node --test scripts/verify-style-injection.cjs
