name: Dependency validation
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'main' && format('dependency-main-validation sha={0}', github.sha) || format('dependency-validation pr={0} base={1} head={2}', inputs.pr || github.event.pull_request.number, inputs.base || github.event.pull_request.base.sha, inputs.head || github.event.pull_request.head.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation target
        required: true
        default: pr
        type: choice
        options:
          - pr
          - main
      pr:
        description: Dependabot PR number
        required: false
        type: string
      base:
        description: Expected base SHA
        required: false
        type: string
      head:
        description: Expected head SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 再検証対象を確認
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr }}
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        with:
          script: |
            const { VALIDATION_MODE, PR_NUMBER, BASE_SHA, HEAD_SHA } = process.env;
            if (!['pr', 'main'].includes(VALIDATION_MODE)) throw Error('検証 mode が不正');
            if (VALIDATION_MODE === 'main') {
              if (PR_NUMBER || BASE_SHA || HEAD_SHA) throw Error('main 検証に PR 入力は指定できません');
            } else if (!/^[1-9][0-9]*$/.test(PR_NUMBER) || !/^[0-9a-f]{40}$/.test(BASE_SHA) || !/^[0-9a-f]{40}$/.test(HEAD_SHA) || context.sha !== BASE_SHA) {
              throw Error('再検証入力が不正');
            }
            const { owner, repo } = context.repo;
            const repository = (await github.rest.repos.get({owner, repo})).data;
            const base = (await github.rest.repos.getBranch({owner, repo, branch: repository.default_branch})).data.commit.sha;
            if (VALIDATION_MODE === 'main') {
              if (context.ref !== `refs/heads/${repository.default_branch}` || context.sha !== base) throw Error('main 検証は現在の既定ブランチ先端に限定します');
              return;
            }
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: Number(PR_NUMBER)})).data;
            if (pr.state !== 'open' || pr.user.id !== 49699333 || pr.head.repo?.id !== repository.id || pr.base.ref !== repository.default_branch || pr.head.sha !== HEAD_SHA || base !== BASE_SHA) throw Error('PR または base が変化');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (github.event_name == 'pull_request' || inputs.mode == 'main') && github.sha || format('refs/pull/{0}/merge', inputs.pr) }}
          fetch-depth: 2
      - name: '検証基点 pr=${{ inputs.pr || github.event.pull_request.number }} base=${{ inputs.base || github.event.pull_request.base.sha }} head=${{ inputs.head || github.event.pull_request.head.sha }}'
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'main'
        env:
          BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          if [ -n "$MERGE_SHA" ]; then test "$(git rev-parse HEAD)" = "$MERGE_SHA"; fi
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
      - name: Setup Bun
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Install locked dependencies
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Sync support assets
        run: bun --bun run sync:support
      - name: Validate web-ext release contract
        run: pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
      - name: Validate Dependabot auto-merge decisions
        run: bun test ./scripts/verify-dependabot-auto-merge.cjs
      - name: Validate 1
        run: bun --bun run check:support
      - name: Validate 2
        run: bun --bun run build:default
      - name: Validate 3
        run: bun --bun run build:notosans
      - name: Validate 4
        run: bun test ./scripts/verify-style-injection.cjs
