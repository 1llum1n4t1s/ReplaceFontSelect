# postinstall でネイティブビルドが必要な依存を明示許可（pnpm v10.12+ はここで管理）
allowBuilds:
  puppeteer: true
  spawn-sync: true
  ttf2woff2: true
minimumReleaseAgeExclude:
  - '@kagayoi/support-extension@1.0.8'
  - puppeteer-core@25.15.0
  - puppeteer@25.15.0

# 推移的依存のセキュリティ修正版。親パッケージ側で解決できたら再評価する。
overrides:
  node-forge: 1.4.2
  ip-address: 10.7.5
