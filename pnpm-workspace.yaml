# postinstall でネイティブビルドが必要な依存を明示許可（pnpm v10.12+ はここで管理）
allowBuilds:
  puppeteer: true
  spawn-sync: true
  ttf2woff2: true
minimumReleaseAgeExclude:
  - '@kagayoi/support-extension@1.0.8'
  - puppeteer-core@25.15.0
  - puppeteer@25.15.0

# CVE-2026-85393: 上流PR #1152に加え、不正なNULL内容も拒否する。
# https://github.com/digitalbazaar/forge/pull/1152 （公式修正版の公開後に再評価）
patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
