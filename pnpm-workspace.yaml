# GitHub dependency graph が読める単一document lockfileを維持する。
# pnpmの版はpackageManagerとCIで指定し、pnpm自身の自動切替・lock記録は無効にする。
pmOnFail: ignore

# postinstall でネイティブビルドが必要な依存を明示許可（pnpm v10.12+ はここで管理）
allowBuilds:
  puppeteer: true
  spawn-sync: true
  ttf2woff2: true
minimumReleaseAgeExclude:
  - '@kagayoi/support-extension@1.0.9'
  - puppeteer-core@25.15.0
  - puppeteer@25.15.0

# 推移的依存のセキュリティ修正版。親パッケージ側で解決できたら再評価する。
overrides:
  node-forge: 1.4.2
  ip-address: 10.7.5
  'cacache>glob': 14.0.2
